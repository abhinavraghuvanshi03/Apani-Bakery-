- name: Extract app project
        run: |
          unzip -o apni_bakery_flutter_app.zip -d app
          ls -la app

      - name: Replace main.dart with fixed version
        run: cp main.dart app/lib/main.dart
        name: Build Apni Bakery APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract app project
        run: |
          unzip -o apni_bakery_flutter_app.zip -d app
          ls -la app

      - name: Replace main.dart with fixed version
        run: cp main.dart app/lib/main.dart

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.8'
          channel: stable

      - name: Create Android project
        working-directory: app
        run: |
          flutter create --platforms=android .

      - name: Get dependencies
        working-directory: app
        run: flutter pub get

      - name: Build APK
        working-directory: app
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apni-bakery-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk
